<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var ORDER=["浦东","黄浦","静安","徐汇","长宁","普陀","虹口","杨浦","宝山","闵行","嘉定","金山","松江","青浦","奉贤","崇明","农场局"];
  var DATA=[],CUR='',Q='',SORT='default',SHOWN=40,FILT=[];
  var listEl=$('#list'),chipsEl=$('#chips'),statEl=$('#stat'),moreEl=$('#more');
  var districtEl=$('#district'),sortEl=$('#sort');

  function parseAll(){
    var els=document.querySelectorAll('script.dc'),out=[],i,j,seen={};
    for(i=0;i<els.length;i++){
      var lines=els[i].textContent.split('\n'),g='';
      for(j=0;j<lines.length;j++){
        var L=lines[j].trim();
        if(!L)continue;
        if(L.charAt(0)==='@'){g=L.slice(1);continue}
        var parts=L.split('|');
        if(parts.length < 2)continue;
        var name=parts[0],rest=parts.slice(1).join('|'),flag=0;
        var q=rest.lastIndexOf('|');
        if(q>0&&rest.slice(q+1)==='1'){flag=1;rest=rest.slice(0,q)}
        var key=g+'#'+name+'#'+rest;
        if(seen[key])continue;
        seen[key]=1;
        out.push({g:g,n:name,a:rest,f:flag});
      }
    }
    return out;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}

  function buildChips(){
    var counts={},i;
    for(i=0;i<DATA.length;i++)counts[DATA[i].g]=(counts[DATA[i].g]||0)+1;
    var h='<button class="c'+(CUR===''?' on':'')+'" data-g="">全部<i>'+DATA.length+'</i></button>';
    for(i=0;i<ORDER.length;i++){
      var g=ORDER[i];
      if(!counts[g])continue;
      h+='<button class="c'+(CUR===g?' on':'')+'" data-g="'+g+'">'+g+'<i>'+counts[g]+'</i></button>';
    }
    chipsEl.innerHTML=h;
  }

  function buildDistrictSelect(){
    var counts={},i;
    for(i=0;i<DATA.length;i++)counts[DATA[i].g]=(counts[DATA[i].g]||0)+1;
    var h='<option value="">全部区（共 '+DATA.length+' 家）</option>';
    for(i=0;i<ORDER.length;i++){
      var g=ORDER[i];
      if(!counts[g])continue;
      h+='<option value="'+g+'"'+(CUR===g?' selected':'')+'>'+g+'（'+counts[g]+' 家）</option>';
    }
    districtEl.innerHTML=h;
  }

  function filter(){
    var q=Q.trim().toLowerCase();
    if(q.indexOf('上海市')===0)q=q.slice(3);
    if(q.indexOf('上海')===0)q=q.slice(2);
    FILT=[];
    for(var i=0;i<DATA.length;i++){
      var d=DATA[i];
      if(CUR&&d.g!==CUR)continue;
      if(q&&d.n.toLowerCase().indexOf(q)<0&&d.a.toLowerCase().indexOf(q)<0)continue;
      FILT.push(d);
    }
    // 默认按区顺序+名称排序
    if(!SORT||SORT==='default'){
      FILT.sort(function(a,b){
        var ai=ORDER.indexOf(a.g),bi=ORDER.indexOf(b.g);
        if(ai!==bi)return ai-bi;
        return a.n.localeCompare(b.n,'zh-CN');
      });
    }else if(SORT==='name'){
      FILT.sort(function(a,b){return a.n.localeCompare(b.n,'zh-CN')});
    }
  }

  function render(){
    filter();
    var end=Math.min(SHOWN,FILT.length),h='',i;
    var lastGroup='';
    for(i=0;i<end;i++){
      var d=FILT[i];
      // 按区分组标题
      if(d.g!==lastGroup){
        lastGroup=d.g;
        var grpCount=0;
        for(var k=0;k<FILT.length;k++){if(FILT[k].g===d.g)grpCount++}
        h+='<div class="gh">'+d.g+'区<i>'+grpCount+' 家</i></div>';
      }
      h+='<div class="it"><div class="nm">'+esc(d.n)+(d.f?'<span class="fl">协议中止</span>':'')+'</div><div class="ad">'+esc(d.a)+'</div></div>';
    }
    if(!FILT.length)h='<div class="ep">没有匹配的机构<br>试试更换区县或搜索关键词</div>';
    listEl.innerHTML=h;
    statEl.innerHTML='当前显示 <b>'+end+'</b> / 共 '+FILT.length+' 家'
      +(CUR?'（'+CUR+'区':'（全部区')
      +(Q?'，关键词：'+esc(Q):'')
      +'）';
    moreEl.innerHTML=end<FILT.length?'<button class="mr" id="mr">显示更多（还有 '+(FILT.length-end)+' 家）</button>':'';
    var btn=$('#mr');
    if(btn)btn.addEventListener('click',function(){SHOWN+=40;render()});
  }

  function reload(){
    DATA=parseAll();
    $('#tot').textContent=DATA.length;
    buildDistrictSelect();
    buildChips();
    render();
  }
  window.__reload=reload;

  // 下拉筛选事件
  districtEl.addEventListener('change',function(){
    CUR=this.value;SHOWN=40;
    buildChips();render();
  });

  // 排序事件
  sortEl.addEventListener('change',function(){
    SORT=this.value;SHOWN=40;render();
  });

  chipsEl.addEventListener('click',function(e){
    var b=e.target.closest('.c');
    if(!b)return;
    CUR=b.getAttribute('data-g');SHOWN=40;
    buildDistrictSelect();
    buildChips();render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  $('#q').addEventListener('input',function(){
    Q=this.value;SHOWN=40;render();
  });

  reload();
})();
</script>
</body>
</html>
